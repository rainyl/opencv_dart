name: CvNativeMl
description: |
  Native bindings for OpenCV - ml
output:
  bindings: ../lib/src/g/ml.g.dart
  symbol-file:
    output: 'package:dartcv4/src/g/ml.yaml'
    import-path: 'package:dartcv4/src/g/ml.g.dart'
ffi-native:
  asset-id: 'package:dartcv4/dartcv.dart' # Optional.
import:
  symbol-files:
    - 'package:dartcv4/src/g/types.yaml'
compiler-opts: "-Isrc -Idartcv"
sort: true
include-unused-typedefs: true
headers:
  entry-points:
    - ../src/dartcv/ml/ann_mlp.h
    - ../src/dartcv/ml/boost.h
    - ../src/dartcv/ml/dtrees.h
    - ../src/dartcv/ml/em.h
    - ../src/dartcv/ml/knearest.h
    - ../src/dartcv/ml/logistic_regression.h
    - ../src/dartcv/ml/normal_bayes_classifier.h
    - ../src/dartcv/ml/rtrees.h
    - ../src/dartcv/ml/stat_model.h
    - ../src/dartcv/ml/svm.h
    - ../src/dartcv/ml/svmsgd.h
    - ../src/dartcv/ml/train_data.h
  include-directives:
    - ../src/dartcv/ml/ann_mlp.h
    - ../src/dartcv/ml/boost.h
    - ../src/dartcv/ml/dtrees.h
    - ../src/dartcv/ml/em.h
    - ../src/dartcv/ml/knearest.h
    - ../src/dartcv/ml/logistic_regression.h
    - ../src/dartcv/ml/normal_bayes_classifier.h
    - ../src/dartcv/ml/rtrees.h
    - ../src/dartcv/ml/stat_model.h
    - ../src/dartcv/ml/svm.h
    - ../src/dartcv/ml/svmsgd.h
    - ../src/dartcv/ml/train_data.h

functions:
  symbol-address:
    include:
      - ".*_Close.*"
      - ".*_close.*"

preamble: |
  // coverage:ignore-file
  // opencv_dart - OpenCV bindings for Dart language
  //    License: Apache-2.0 https://github.com/hybridgroup/gocv/blob/release/LICENSE.txt
  // Author: Rainyl
  // License: Apache-2.0
  // Date: 2024/01/28

comments:
  style: doxygen # Options - doxygen(default) / any.
  length: full # Options - brief / full(default).
