name: Test, Publish to pub.dev and release

on:
  push:
    branches: ["main"]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*' # tag pattern on pub.dev: 'v{{version}}'
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the version of the selected ref to pub.dev"
        required: false
        default: false
        type: boolean

jobs:
  test:
    name: test-${{ matrix.os }}
    strategy:
      # One OS failing must not cancel the others: they are independent signals.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Enable Git long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - name: Install the GTK headers highgui needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: subosito/flutter-action@v2
        with:
          # The SDK `.fvmrc` pins: `stable` moves under the tests several times a year.
          flutter-version-file: .fvmrc
          cache: true
      # The native build (OpenCV from source) is the slow part of these jobs. Dart caches the hook
      # output itself, in `.dart_tool/hooks_runner`, but only on the machine that built it, and that
      # cache's key covers the hook files - not `src/**` - so restoring it wholesale would hand a PR
      # that changed C++ a stale binary. Cache the CMake build tree (`shared/`) instead and drop the
      # cached *results* below: the hook then re-runs, `cmake --build` only redoes what changed, and
      # the job drops from ~10-15 min to ~1 min. Must run after checkout: `hashFiles` reads the work
      # tree.
      - name: Restore the OpenCV build tree
        uses: actions/cache@v4
        with:
          path: packages/dartcv/.dart_tool/hooks_runner/shared
          key: >-
            hooks-${{ runner.os }}-${{ hashFiles('.fvmrc') }}-${{
            hashFiles('packages/dartcv/src/**', 'packages/dartcv/hook/**',
            'packages/dartcv/lib/src/hook_helpers/**', 'packages/dartcv/pubspec.yaml') }}
          restore-keys: |
            hooks-${{ runner.os }}-${{ hashFiles('.fvmrc') }}-
      - name: Force the native build hooks to re-run
        shell: bash
        run: |
          rm -rf packages/dartcv/.dart_tool/hooks_runner/dartcv4
          rm -rf packages/dartcv/.dart_tool/hooks_runner/ffigen
      - name: Cache the dnn test models
        id: models
        uses: actions/cache@v4
        with:
          path: packages/dartcv/test/models
          # Bump the trailing version if the `dnn_test_files` release is replaced.
          key: models-dnn_test_files-v1
      - name: Download the dnn test models
        if: steps.models.outputs.cache-hit != 'true'
        uses: robinraju/release-downloader@v1.10
        with:
          repository: "rainyl/opencv_dart"
          tag: "dnn_test_files"
          fileName: "models.zip"
          out-file-path: "packages/dartcv/test/"
          extract: true
      - name: Install dependencies
        working-directory: packages/dartcv
        run: dart pub get
      - name: Analyze
        if: runner.os == 'Linux'
        working-directory: packages/dartcv
        run: dart analyze
      - name: Run Test
        working-directory: packages/dartcv
        run: dart test -x skip-workflow

  web:
    name: web-${{ matrix.os }}
    strategy:
      # Every platform builds the module *and* runs the browser suite against its own build: the
      # toolchain is what these jobs cover, and a Windows- or macOS-only regression (path separators,
      # `emcc.exe`, response files, a missing Ninja) is exactly what a single-OS job misses.
      fail-fast: false
      matrix:
        include:
          # The oldest Emscripten the builder supports, so a regression in the floor version shows up.
          - os: ubuntu-latest
            emsdk: "6.0.13"
          - os: windows-latest
            emsdk: "7.0.0"
          - os: macos-latest
            emsdk: "7.0.0"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        shell: bash
        run: |
          if ninja --version; then exit 0; fi
          case "$RUNNER_OS" in
            Linux) sudo apt-get update && sudo apt-get install -y ninja-build ;;
            macOS) brew install ninja ;;
            *) choco install ninja -y ;;
          esac
      # The CMake build tree for the wasm target holds the compiled OpenCV objects and its source
      # checkout (`_deps`), so restoring it turns most of the build into a no-op. The key follows the
      # Emscripten version and the CMake inputs; `build/wasm` only gets reused for the same toolchain.
      - name: Restore the wasm build tree
        uses: actions/cache@v4
        with:
          path: packages/dartcv/build/wasm
          key: wasm-${{ runner.os }}-emsdk-${{ matrix.emsdk }}-all-${{
            hashFiles('packages/dartcv/tool/web/**', 'packages/dartcv/bin/**',
            'packages/dartcv/src/**', 'packages/dartcv/lib/src/g/*.g.dart',
            'packages/dartcv/pubspec.yaml') }}
          restore-keys: |
            wasm-${{ runner.os }}-emsdk-${{ matrix.emsdk }}-
      - uses: mymindstorm/setup-emsdk@v14
        with:
          # No actions-cache-folder: setup-emsdk builds the cache key from the workflow name, and the
          # comma in this workflow's name is rejected as a key.
          version: ${{ matrix.emsdk }}
      - uses: subosito/flutter-action@v2
        with:
          # The SDK `.fvmrc` pins; also what `dart test -p chrome` runs on.
          flutter-version-file: .fvmrc
          cache: true
      - name: Install dependencies
        working-directory: packages/dartcv
        run: dart pub get
      - name: Check the generated bindings, facades and version are up to date
        working-directory: packages/dartcv
        run: dart tool/web/gen_web_bindings.dart --check
      - name: Build dartcv.js / dartcv.wasm
        working-directory: packages/dartcv
        run: dart tool/web/build_wasm.dart
      - name: Check the module
        shell: bash
        working-directory: packages/dartcv
        run: |
          test -f build/web/dartcv.js
          test -f build/web/dartcv.wasm
          size=$(wc -c < build/web/dartcv.wasm)
          echo "dartcv.wasm: $size bytes"
          if [ "$size" -lt 1000000 ]; then
            echo "::error::dartcv.wasm is suspiciously small ($size bytes)"
            exit 1
          fi
          exports=$(wc -l < build/wasm/exports.txt)
          echo "exports: $exports"
          if [ "$exports" -lt 500 ]; then
            echo "::error::only $exports exports"
            exit 1
          fi
      - name: Cache the dnn test models
        id: models
        uses: actions/cache@v4
        with:
          path: packages/dartcv/test/models
          # Bump the trailing version if the `dnn_test_files` release is replaced.
          key: models-dnn_test_files-v1
      - name: Download the dnn test models
        if: steps.models.outputs.cache-hit != 'true'
        uses: robinraju/release-downloader@v1.10
        with:
          repository: "rainyl/opencv_dart"
          tag: "dnn_test_files"
          fileName: "models.zip"
          out-file-path: "packages/dartcv/test/"
          extract: true
      - name: Run tests in Chrome (dart2js and dart2wasm)
        working-directory: packages/dartcv
        run: |
          dart test -p chrome test/web_test.dart
          dart test -p chrome -c dart2wasm test/web_test.dart
      - name: Build the opencv_dart example for the web against this dartcv4
        shell: bash
        working-directory: packages/opencv_dart/example
        run: |
          printf 'dependency_overrides:\n  dartcv4:\n    path: ../../dartcv\n' > pubspec_overrides.yaml
          cp ../../dartcv/build/web/dartcv.js ../../dartcv/build/web/dartcv.wasm web/
          flutter pub get
          flutter build web
          flutter build web --wasm
      # One artifact is enough for `release` to ship; the other two platforms only validate.
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: dartcv-web
          path: |
            packages/dartcv/build/web/dartcv.js
            packages/dartcv/build/web/dartcv.wasm
          if-no-files-found: error

  check-release:
    name: check-release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    needs: [test, web]
    runs-on: ubuntu-latest
    outputs:
      # "true" when that package still has to be published, "false" when the version is already on
      # pub.dev (which is not an error: a tag may only carry a dartcv4 change).
      dartcv4: ${{ steps.versions.outputs.dartcv4 }}
      wrapper: ${{ steps.versions.outputs.wrapper }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the versions and the changelogs
        id: versions
        run: |
          set -euo pipefail
          dartcv=$(sed -n 's/^version: *//p' packages/dartcv/pubspec.yaml)
          wrapper=$(sed -n 's/^version: *//p' packages/opencv_dart/pubspec.yaml)
          echo "dartcv4=$dartcv opencv_dart=$wrapper ref=$GITHUB_REF"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag=${GITHUB_REF#refs/tags/v}
            if [ "$tag" != "$dartcv" ]; then
              echo "::error::tag v$tag must match packages/dartcv/pubspec.yaml version $dartcv"
              exit 1
            fi
          fi

          published() { curl -sf "https://pub.dev/api/packages/$1/versions/$2" > /dev/null; }
          needs_section() {  # changelog of package $1 must have a "## $2" heading
            if ! grep -qE "^## +\[?v?$2\]?$" "packages/$1/CHANGELOG.md"; then
              echo "::error::packages/$1/CHANGELOG.md has no '## $2' section"
              exit 1
            fi
          }

          pub_dartcv4=true
          if published dartcv4 "$dartcv"; then
            echo "::notice::dartcv4 $dartcv is already published, skipping it"
            pub_dartcv4=false
          else
            needs_section dartcv "$dartcv"
          fi

          pub_wrapper=true
          if published opencv_dart "$wrapper"; then
            echo "::notice::opencv_dart $wrapper is already published, skipping it"
            pub_wrapper=false
          else
            needs_section opencv_dart "$wrapper"
          fi

          if [ "$pub_dartcv4" = false ] && [ "$pub_wrapper" = false ]; then
            echo "::error::both versions are already on pub.dev - bump a version before tagging"
            exit 1
          fi

          echo "dartcv4=$pub_dartcv4" >> "$GITHUB_OUTPUT"
          echo "wrapper=$pub_wrapper" >> "$GITHUB_OUTPUT"

  publish-dartcv4:
    name: Publish dartcv4
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    needs: [test, web, check-release]
    permissions:
      id-token: write # Required for authentication using OIDC
    runs-on: ubuntu-latest
    environment: pub.dev
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Install dependencies
        if: needs.check-release.outputs.dartcv4 == 'true'
        working-directory: packages/dartcv
        run: dart pub get
      - name: Publish
        if: needs.check-release.outputs.dartcv4 == 'true'
        working-directory: packages/dartcv
        run: dart pub publish --force
      - name: Nothing to publish
        if: needs.check-release.outputs.dartcv4 != 'true'
        run: echo "dartcv4 is already on pub.dev, nothing to do"

  wait-for-dartcv4:
    name: wait-for-dartcv4
    # A freshly published version is not resolvable immediately: pub.dev has to index it first, and
    # publishing opencv_dart runs `pub get` as part of its validation. Instead of sleeping for a
    # guessed amount of time, poll until opencv_dart's *own* resolution picks the new version - that
    # also proves its `dartcv4` constraint admits it.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    needs: [check-release, publish-dartcv4]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          # The SDK `.fvmrc` pins: `stable` moves under the tests several times a year.
          flutter-version-file: .fvmrc
          cache: true
      - name: Wait until opencv_dart resolves the new dartcv4
        if: needs.check-release.outputs.wrapper == 'true'
        working-directory: packages/opencv_dart
        run: |
          set -euo pipefail
          want=$(sed -n 's/^version: *//p' ../dartcv/pubspec.yaml)
          # A checked-in override would hide a constraint that does not admit $want.
          rm -f pubspec_overrides.yaml pubspec.lock
          resolved() {
            flutter pub get > /dev/null 2>&1 || true
            flutter pub deps --json 2>/dev/null | python3 -c '
              import json, sys
              deps = json.load(sys.stdin)["packages"]
              print(next((p["version"] for p in deps if p["name"] == "dartcv4"), "none"))
            ' 2>/dev/null || echo none
          }
          for attempt in $(seq 1 40); do        # 40 x 30s = 20 minutes
            got=$(resolved)
            if [ "$got" = "$want" ]; then
              echo "dartcv4 $want resolved after $attempt attempt(s)"
              exit 0
            fi
            echo "attempt $attempt: opencv_dart resolved dartcv4 '$got', want $want; sleeping 30s"
            sleep 30
          done
          echo "::error::dartcv4 $want is still not resolvable after 20 minutes"
          exit 1
      - name: Validate opencv_dart against the new dartcv4
        if: needs.check-release.outputs.wrapper == 'true'
        working-directory: packages/opencv_dart
        run: flutter pub publish --dry-run
      - name: Nothing to publish
        if: needs.check-release.outputs.wrapper != 'true'
        run: echo "opencv_dart is already on pub.dev, nothing to do"

  publish-opencv-dart:
    name: Publish opencv_dart
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    needs: [web, check-release, wait-for-dartcv4]
    permissions:
      id-token: write # Required for authentication using OIDC
    runs-on: ubuntu-latest
    environment: pub.dev
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          # The SDK `.fvmrc` pins: `stable` moves under the tests several times a year.
          flutter-version-file: .fvmrc
          cache: true
      - name: Install dependencies
        if: needs.check-release.outputs.wrapper == 'true'
        working-directory: packages/opencv_dart
        run: flutter pub get
      - name: Publish
        if: needs.check-release.outputs.wrapper == 'true'
        working-directory: packages/opencv_dart
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if flutter pub publish --force 2>&1 | tee /tmp/publish.log; then
              exit 0
            fi
            # Only a dartcv4 that pub.dev does not serve yet is worth retrying; anything else (packaging,
            # analysis) is a real failure.
            if grep -qiE 'version solving failed|does not match any versions|could not find' /tmp/publish.log; then
              echo "attempt $attempt: dartcv4 not visible yet, retrying in 2 minutes"
              sleep 120
            else
              exit 1
            fi
          done
          exit 1
      - name: Nothing to publish
        if: needs.check-release.outputs.wrapper != 'true'
        run: echo "opencv_dart is already on pub.dev, nothing to do"

  publish-dry-run:
    name: publish-dry-run
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          # The SDK `.fvmrc` pins: `stable` moves under the tests several times a year.
          flutter-version-file: .fvmrc
          cache: true
      - name: dartcv4
        working-directory: packages/dartcv
        run: |
          dart pub get
          dart pub publish --dry-run
      - name: opencv_dart
        working-directory: packages/opencv_dart
        run: |
          # The wrapper pins an exact dartcv4 (`^2.4.0-dev.0` while that is unreleased), so on a PR
          # before the release there is nothing to validate - the constraint is *supposed* to fail
          # until dartcv4 is on pub.dev. Anything else (a real packaging problem) still fails below.
          if ! out=$(flutter pub get 2>&1); then
            echo "$out"
            # Only "the pinned dartcv4 is not on pub.dev yet" is expected before a release; any
            # other resolution failure is a real problem and must fail.
            if grep -q "doesn't match any versions" <<< "$out"; then
              echo "::warning::dartcv4 is not on pub.dev yet; skipping the opencv_dart dry-run"
              exit 0
            fi
            exit 1
          fi
          flutter pub publish --dry-run

  release:
    needs: [test, web, publish-dartcv4, publish-opencv-dart]
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dartcv-web
          path: dartcv-web
      # The asset name carries the version, so a downloaded zip says which dartcv4 it belongs to.
      - name: Package the web build
        id: package
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version: *//p' packages/dartcv/pubspec.yaml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          cd dartcv-web
          zip "../dartcv-web-$version.zip" dartcv.js dartcv.wasm
      - name: release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: false
          prerelease: ${{ contains(steps.package.outputs.version, '-') }}
          generate_release_notes: true
          files: dartcv-web-${{ steps.package.outputs.version }}.zip
